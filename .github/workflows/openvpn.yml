name: "OpenVPN Server via Cloudflare Tunnel"

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duration to keep the OpenVPN server alive (in minutes)"
        required: true
        default: "360"
        type: choice
        options:
          - "30"
          - "60"
          - "120"
          - "180"
          - "360"
      vpn_port:
        description: "OpenVPN TCP Port"
        required: true
        default: "1194"
        type: string

jobs:
  openvpn-server:
    name: "OpenVPN Server (Cloudflare Tunnel)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install OpenVPN, Easy-RSA & Dependencies"
        run: |
          echo "::group::Installing Packages"
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openvpn \
            easy-rsa \
            iptables \
            curl \
            net-tools
          echo "::endgroup::"

      - name: "Enable Kernel IP Forwarding & NAT Routing"
        run: |
          echo "::group::Configuring Networking & IP Forwarding"
          # Enable IPv4 forwarding
          sudo sysctl -w net.ipv4.ip_forward=1
          echo "net.ipv4.ip_forward=1" | sudo tee -a /etc/sysctl.conf

          # Determine the default outbound network interface
          DEFAULT_IF=$(ip route | grep default | awk '{print $5}' | head -n 1)
          echo "Default outbound network interface: $DEFAULT_IF"

          # Configure iptables NAT masquerading for VPN subnet 10.8.0.0/24
          sudo iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o "$DEFAULT_IF" -j MASQUERADE
          sudo iptables -A FORWARD -s 10.8.0.0/24 -j ACCEPT
          sudo iptables -A FORWARD -d 10.8.0.0/24 -m state --state RELATED,ESTABLISHED -j ACCEPT

          echo "✅ NAT masquerading & IP forwarding enabled."
          echo "::endgroup::"

      - name: "Generate PKI & Certificates (OpenSSL)"
        run: |
          echo "::group::Generating Certificates and Keys"
          mkdir -p /tmp/openvpn-pki
          cd /tmp/openvpn-pki

          # 1. CA Key & Certificate
          openssl genrsa -out ca.key 2048
          openssl req -new -x509 -days 3650 -key ca.key -out ca.crt -subj "/CN=GitHub-Actions-OpenVPN-CA"

          # 2. Server Key & Certificate
          openssl genrsa -out server.key 2048
          openssl req -new -key server.key -out server.csr -subj "/CN=openvpn-server"
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 365

          # 3. Client Key & Certificate
          openssl genrsa -out client.key 2048
          openssl req -new -key client.key -out client.csr -subj "/CN=client-mac"
          openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 365

          # 4. Diffie-Hellman Parameters (fast 2048-bit)
          openssl dhparam -out dh2048.pem 2048

          # 5. Move keys into OpenVPN directory
          sudo mkdir -p /etc/openvpn/server
          sudo cp ca.crt server.crt server.key dh2048.pem /etc/openvpn/server/
          sudo chmod 600 /etc/openvpn/server/server.key

          echo "✅ PKI & Certificates generated."
          echo "::endgroup::"

      - name: "Configure & Start OpenVPN Server (TCP)"
        env:
          PORT: ${{ github.event.inputs.vpn_port || '1194' }}
        run: |
          echo "::group::Configuring OpenVPN Server"
          cat << EOF | sudo tee /etc/openvpn/server/server.conf
          port $PORT
          proto tcp-server
          dev tun
          ca /etc/openvpn/server/ca.crt
          cert /etc/openvpn/server/server.crt
          key /etc/openvpn/server/server.key
          dh /etc/openvpn/server/dh2048.pem
          server 10.8.0.0 255.255.255.0
          ifconfig-pool-persist /var/log/openvpn-ipp.txt
          push "redirect-gateway def1 bypass-dhcp"
          push "dhcp-option DNS 1.1.1.1"
          push "dhcp-option DNS 1.0.0.1"
          keepalive 10 120
          cipher AES-256-GCM
          data-ciphers AES-256-GCM:AES-128-GCM
          persist-key
          persist-tun
          status /var/log/openvpn-status.log
          log /var/log/openvpn.log
          verb 3
          mute 20
          EOF

          # Start OpenVPN Server in background
          sudo openvpn --config /etc/openvpn/server/server.conf &
          VPN_PID=$!
          echo "OpenVPN started with PID: $VPN_PID"

          # Verify OpenVPN is listening
          sleep 3
          if ! sudo netstat -tlpn | grep ":$PORT "; then
            echo "::error::OpenVPN failed to listen on port $PORT"
            sudo cat /var/log/openvpn.log
            exit 1
          fi
          echo "✅ OpenVPN Server is listening on TCP port $PORT."
          echo "::endgroup::"

      - name: "Install & Run Cloudflare Tunnel (cloudflared)"
        id: tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          PORT: ${{ github.event.inputs.vpn_port || '1194' }}
        run: |
          echo "::group::Install cloudflared"
          curl -sL --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          rm -f /tmp/cloudflared.deb
          echo "cloudflared installed version: $(cloudflared --version)"
          echo "::endgroup::"

          echo "::group::Launch Cloudflare Tunnel"
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "Starting Cloudflare Zero Trust Tunnel with permanent token..."
            cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
            CF_PID=$!
            sleep 5
            if ! ps -p $CF_PID > /dev/null; then
              echo "::error::cloudflared exited immediately. Log output:"
              cat /tmp/cloudflared.log
              exit 1
            fi
            echo "CF_MODE=token" >> $GITHUB_ENV
            echo "TUNNEL_HOST=your-configured-hostname" >> $GITHUB_ENV
            echo "✅ Named Cloudflare Zero Trust Tunnel is connected."
          else
            echo "No CLOUDFLARE_TUNNEL_TOKEN detected. Starting instant Cloudflare Quick Tunnel (trycloudflare.com)..."
            cloudflared tunnel --no-autoupdate --url "tcp://localhost:$PORT" > /tmp/cloudflared.log 2>&1 &
            CF_PID=$!
            
            CF_URL=""
            for i in {1..30}; do
              CF_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$CF_URL" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$CF_URL" ]; then
              echo "::error::Failed to establish Quick Tunnel. Logs:"
              cat /tmp/cloudflared.log
              exit 1
            fi

            TUNNEL_HOST=$(echo "$CF_URL" | sed 's|https://||')
            echo "CF_MODE=quick" >> $GITHUB_ENV
            echo "TUNNEL_HOST=$TUNNEL_HOST" >> $GITHUB_ENV
            echo "✅ Instant Cloudflare Quick Tunnel active on: $TUNNEL_HOST"
          fi
          echo "::endgroup::"

      - name: "Generate Standalone Client .ovpn Profile"
        env:
          PORT: ${{ github.event.inputs.vpn_port || '1194' }}
        run: |
          echo "::group::Creating client.ovpn"
          mkdir -p client-config

          CA_DATA=$(cat /tmp/openvpn-pki/ca.crt)
          CERT_DATA=$(openssl x509 -in /tmp/openvpn-pki/client.crt)
          KEY_DATA=$(cat /tmp/openvpn-pki/client.key)

          cat << EOF > client-config/client.ovpn
          client
          dev tun
          proto tcp-client
          remote 127.0.0.1 $PORT
          resolv-retry infinite
          nobind
          persist-key
          persist-tun
          remote-cert-tls server
          cipher AES-256-GCM
          verb 3
          redirect-gateway def1 bypass-dhcp

          <ca>
          $CA_DATA
          </ca>

          <cert>
          $CERT_DATA
          </cert>

          <key>
          $KEY_DATA
          </key>
          EOF

          # Also write client configuration info
          echo "${{ env.TUNNEL_HOST }}" > client-config/hostname.txt

          echo "✅ client.ovpn profile created successfully."
          echo "::endgroup::"

      - name: "Upload Client Profile Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-client-profile
          path: client-config/
          retention-days: 1

      - name: "Summary & Connection Instructions"
        env:
          PORT: ${{ github.event.inputs.vpn_port || '1194' }}
          MINUTES: ${{ github.event.inputs.duration_minutes || '360' }}
          HOST: ${{ env.TUNNEL_HOST }}
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 OpenVPN Cloud Server is ONLINE!

          Protected & Forwarded via **Cloudflare Tunnel** (\`cloudflared\`).

          ---

          ### 🌐 Tunnel Hostname:
          \`\`\`
          $HOST
          \`\`\`

          ---

          ### 📥 1. Download Client Profile
          Download the **\`openvpn-client-profile\`** artifact from the Artifacts section at the top of this run.

          ---

          ### 💻 2. Connect from MacBook:

          \`\`\`bash
          ./connect-mac.sh $HOST
          \`\`\`

          ---
          - **Duration**: $MINUTES minutes
          - **Tunnel Mode**: ${{ env.CF_MODE }}
          - **Protocol**: OpenVPN over TCP ($PORT)
          EOF

      - name: "Keep-Alive Loop with Health Check"
        run: |
          MINUTES="${{ github.event.inputs.duration_minutes || '360' }}"
          TOTAL_SECONDS=$((MINUTES * 60))
          ELAPSED=0

          echo "=========================================================="
          echo "🟢 OPENVPN SERVER RUNNING IN GITHUB ACTIONS!"
          echo "Tunnel Host: ${{ env.TUNNEL_HOST }}"
          echo "Duration: $MINUTES minutes"
          echo "Traffic is routing through GitHub/Azure network"
          echo "=========================================================="

          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            sleep 30
            ELAPSED=$((ELAPSED + 30))
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))

            # Health checks
            if ! pgrep -f "openvpn" > /dev/null; then
              echo "::error::OpenVPN server process stopped!"
              sudo cat /var/log/openvpn.log
              exit 1
            fi
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "::error::cloudflared tunnel process stopped!"
              cat /tmp/cloudflared.log
              exit 1
            fi

            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 🟢 OpenVPN & Cloudflare Tunnel Healthy. Remaining: ~$REMAINING min"
          done

          echo "Session duration completed. Tearing down OpenVPN session."
